<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400"><text x="14" y="38" font-family="Fira Code" font-size="9" fill="currentColor" direction="ltr">while (alive) {</text><text x="24" y="52" font-family="Fira Code" font-size="9" fill="currentColor" direction="ltr">eat();</text><text x="24" y="64" font-family="Fira Code" font-size="9" fill="currentColor" direction="ltr">code();</text><text x="24" y="76" font-family="Fira Code" font-size="9" fill="currentColor" direction="ltr" opacity=".45">sleep();</text><text x="14" y="88" font-family="Fira Code" font-size="9" fill="currentColor" direction="ltr">}</text></svg>
