<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMG Store</title>
<link rel="icon" type="image/svg+xml" href="brand/mark.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Cairo:wght@400;600;700;900&family=Lalezar&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;900&family=Tajawal:wght@500;800&family=Lalezar&family=Reem+Kufi:wght@700&family=Amiri:wght@700&family=Bebas+Neue&family=Oswald:wght@600&family=Pacifico&family=Playfair+Display:wght@700&family=Permanent+Marker&family=Anton&family=Montserrat:wght@800&family=Bangers&family=Lobster&family=Dancing+Script:wght@700&family=Righteous&family=Russo+One&family=Black+Ops+One&family=Abril+Fatface&family=Bungee&family=Great+Vibes&family=Caveat:wght@700&family=Changa:wght@700&family=El+Messiri:wght@700&family=Aref+Ruqaa:wght@700&family=Rakkas&family=Marhey:wght@700&family=Lemonada:wght@700&family=Kufam:wght@700&family=Jomhuria&family=Mirza:wght@700&family=Vibes&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
<script src="i18n.js?v=47"></script>
<style>
  :root { --indigo: #4f46e5; --purple: #9333ea; --ink: #18181b; --paper: #f4f4f5; --line: #e4e4e7; --muted: #71717a; --wa: #25d366; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Cairo, Inter, system-ui, sans-serif; background: var(--paper); color: var(--ink); }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header img { height: 34px; display: block; }
  .grow { flex: 1; }
  .btn { font: inherit; font-weight: 700; font-size: 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 7px 14px; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
  .btn.primary { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  .hero { background: linear-gradient(135deg, var(--indigo), var(--purple)); color: #fff; padding: 34px 16px; }
  .hero > div { max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between; }
  .hero h1 { font-family: Lalezar, Cairo; font-weight: 400; font-size: 44px; margin: 0 0 4px; }
  .hero p { margin: 0; font-size: 17px; opacity: .92; }
  .hero .btn { background: #fff; color: var(--indigo); border: 0; font-size: 16px; padding: 11px 20px; }
  main { max-width: 1120px; margin: 0 auto; padding: 18px 16px 60px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chips button { font: inherit; font-weight: 700; font-size: 14px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  .chips button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .card img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #f1f1f4; display: block; }
  .card .b { padding: 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .card h3 { font-size: 16px; margin: 0; overflow-wrap: anywhere; }
  .card .by, .card .kind { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .card .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 10px; }
  .card .price { font-weight: 900; font-size: 17px; }
  .empty { background: #fff; border: 1px dashed #c9c9d1; border-radius: 16px; padding: 50px 20px; text-align: center; color: var(--muted); }
  .empty p { font-size: 18px; margin: 0 0 14px; }
  .how { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .how div { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-weight: 700; font-size: 15px; }
  .how b { color: var(--indigo); font-family: Inter; margin-inline-end: 8px; }
  h2 { font-size: 19px; margin: 34px 0 12px; }
  .card img { cursor: pointer; }
  .pics { position: relative; }
  .pics .real { position: absolute; inset: 0; opacity: 0; transition: opacity .5s; pointer-events: none; }
  .pics .tag { position: absolute; inset-inline-start: 8px; bottom: 8px; padding: 2px 8px; border-radius: 99px; background: rgba(24,24,27,.72); color: #fff; font-size: 11px; font-weight: 700; opacity: 0; transition: opacity .5s; pointer-events: none; }
  .card.flip .real, .card.flip .tag { opacity: 1; }
  .card .acts { display: flex; gap: 6px; margin-top: 8px; }
  .card .acts > * { flex: 1; padding-inline: 4px; white-space: nowrap; }
  .card small { font-weight: 700; color: var(--muted); font-size: 12px; }
  #viewer { border: 0; padding: 0; border-radius: 14px; width: min(920px, 96vw); height: 90vh; overflow: hidden; }
  #viewer::backdrop { background: rgba(0,0,0,.6); }
  #viewer > div { display: flex; flex-direction: column; height: 100%; }
  #viewer .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; font-weight: 700; overflow-wrap: anywhere; }
  #viewer .head div { display: flex; gap: 6px; flex: none; }
  #frame { border: 0; width: 100%; flex: 1; background: #f1f1f4; }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .hero h1 { font-size: 36px; } .card .row { flex-direction: column; align-items: stretch; } }
</style>
</head>
<body>
<header>
  <a href="./"><img src="logo.svg" alt="CMG"></a>
  <div class="grow"></div>
  <button class="btn" id="langBtn" data-i18n="lang.switch">English</button>
  <a class="btn" href="./" data-i18n="store.emptyCta"></a>
</header>
<section class="hero"><div>
  <div><h1 data-i18n="store.title"></h1><p data-i18n="store.lead"></p></div>
  <a class="btn" href="./" id="cta"></a>
</div></section>
<main>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden><p data-i18n="store.empty"></p><a class="btn primary" href="./" data-i18n="store.emptyCta"></a></div>
  <h2 data-i18n="store.how"></h2>
  <div class="how"><div><b>1</b><span data-i18n="store.how1"></span></div><div><b>2</b><span data-i18n="store.how2"></span></div><div><b>3</b><span id="how3"></span></div></div>
</main>
<dialog id="viewer"><div><div class="head"><span id="viewerTitle"></span><div><a class="btn primary" id="viewerOrder"></a><button class="btn" id="viewerClose"></button></div></div><iframe id="frame" title="3D"></iframe></div></dialog>
<script>i18n.apply();</script>
<script type="module">
import SHOP from './config.js?v=39';
import { countVisit } from './counter.js?v=39';
import { listStore, getDesign } from './db.js?v=44';
import { REAL_OF, realPreview } from './real-look.js?v=45';
const $ = s => document.querySelector(s), T = i18n.t, money = n => i18n.money(n);
const OFFER = SHOP.launchOffer?.off && Date.now() < Date.parse(SHOP.launchOffer.until) ? SHOP.launchOffer : null;
const CATS = [['all', () => true], ['hoodies', p => p.startsWith('hoodie')], ['sweats', p => p.startsWith('crew') || p === 'quarter_zip'], ['pants', p => ['joggers', 'sweatpants', 'shorts'].includes(p)]];
let items = [], cat = 'all', flipped = false;
// The real look of each design is drawn once, when its card first comes into view, one card at a time.
const realUrl = new Map();
let queue = Promise.resolve();
function showReal(card, url) {
  card.querySelector('.real').src = url;
  card.classList.add('has-real');
  card.classList.toggle('flip', flipped);
}
const seen = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    seen.unobserve(e.target);
    const card = e.target, code = card.dataset.code;
    queue = queue.then(async () => {
      try {
        if (!realUrl.has(code)) realUrl.set(code, await realPreview((await getDesign(code)).pack));
        if (realUrl.get(code) && card.isConnected) showReal(card, realUrl.get(code));
      } catch (err) { console.error(err); }
    });
  }
}, { rootMargin: '200px' });
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(() => {
  flipped = !flipped;
  document.querySelectorAll('.card.has-real').forEach(c => c.classList.toggle('flip', flipped));
}, 2000);

const piecePrice = (d, sides, stripes) => (SHOP.prices[d.product] ?? 0) - (OFFER?.off || 0) + sides.reduce((a, s) => a + SHOP.printPrices[s], 0) + (stripes ? SHOP.stripesPrice : 0) + SHOP.storeMarkup;
const priceOf = d => piecePrice(d, d.sides, d.stripes) + (d.partner_sides ? piecePrice(d, d.partner_sides, d.partner_stripes) : 0);
const orderLink = d => `./?store=${encodeURIComponent(d.code)}`;
// The 3D view is the studio itself, showing only the design, in a window over the store.
function open3d(d) {
  $('#viewerTitle').textContent = d.title;
  $('#viewerOrder').href = orderLink(d);
  $('#frame').src = `${orderLink(d)}&view3d&nocount&v=44`;
  $('#viewer').showModal();
}
$('#viewerClose').onclick = () => $('#viewer').close();
$('#viewer').addEventListener('close', () => $('#frame').removeAttribute('src'));
function render() {
  const fee = money(SHOP.storeFee);
  $('#cta').textContent = T('store.cta', { fee }); $('#how3').textContent = T('store.how3', { fee });
  $('#viewerOrder').textContent = T('store.order'); $('#viewerClose').textContent = T('store.close');
  $('#chips').innerHTML = '';
  for (const [k] of CATS) {
    const b = document.createElement('button');
    b.textContent = T('store.' + k); b.className = k === cat ? 'on' : '';
    b.onclick = () => { cat = k; render(); };
    $('#chips').append(b);
  }
  $('#chips').hidden = !items.length;
  const test = CATS.find(([k]) => k === cat)[1], shown = items.filter(d => test(d.product));
  $('#empty').hidden = !!items.length;
  const grid = $('#grid'); grid.innerHTML = '';
  for (const d of shown) {
    // Names come from people: always set as text, never as HTML.
    const card = document.createElement('article'); card.className = 'card';
    const img = Object.assign(document.createElement('img'), { src: /^data:image\/jpeg;base64,/.test(d.preview) ? d.preview : '', alt: d.title, loading: 'lazy' });
    const b = document.createElement('div'); b.className = 'b';
    const add = (tag, cls, text) => { const el = document.createElement(tag); el.className = cls; el.textContent = text; return el; };
    const row = add('div', 'row', '');
    const price = add('span', 'price', money(priceOf(d)));
    if (d.partner_sides) price.append(' ', add('small', '', T('store.forBoth')));
    row.append(price);
    const acts = add('div', 'acts', ''), view = add('button', 'btn', T('store.view3d')), go = add('a', 'btn primary', T('store.order'));
    view.onclick = img.onclick = () => open3d(d);
    go.href = orderLink(d); acts.append(view, go);
    b.append(add('h3', '', d.title), add('span', 'by', `${T('store.by')}: ${d.designer}`), add('span', 'kind', T('product.' + d.product) + (d.partner_sides ? ` – ${T('store.couple')}` : '')), row, acts);
    const pics = document.createElement('div'); pics.className = 'pics'; pics.append(img);
    card.dataset.code = d.code; card.append(pics, b); grid.append(card);
    if (REAL_OF[d.product]) {
      pics.append(Object.assign(document.createElement('img'), { className: 'real', alt: '' }), add('span', 'tag', T('store.realTag')));
      if (realUrl.get(d.code)) showReal(card, realUrl.get(d.code)); else if (!realUrl.has(d.code)) seen.observe(card);
    }
  }
}
$('#langBtn').onclick = () => i18n.toggle();
i18n.onChange?.(render);
try { items = await listStore(); } catch (err) { console.error(err); items = []; }
render();
countVisit();
</script>
</body>
</html>
