<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>CMG | لوحة التحكم</title>
<link rel="icon" type="image/svg+xml" href="brand/mark.svg">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root { --indigo: #4f46e5; --line: #e4e4e7; --muted: #71717a; --danger: #dc2626; --green: #16a34a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Cairo, system-ui, sans-serif; background: #f4f4f5; color: #18181b; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; } h2 { font-size: 18px; margin: 28px 0 10px; }
  .muted { color: var(--muted); font-size: 14px; line-height: 1.8; margin: 4px 0; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 12px; }
  .btn { font: inherit; font-weight: 700; border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 8px 14px; cursor: pointer; color: inherit; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ok { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.primary { background: var(--indigo); border-color: var(--indigo); color: #fff; width: 100%; margin-top: 14px; }
  .btn.danger { color: var(--danger); }
  label { display: block; font-weight: 700; font-size: 14px; margin: 10px 0 4px; }
  input { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  #login { max-width: 380px; margin: 50px auto; }
  .item { display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
  .item img { width: 100%; border-radius: 10px; background: #f1f1f4; display: block; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  .row:first-child { border-top: 0; }
  .err { color: var(--danger); font-weight: 700; font-size: 14px; }
  ul { margin: 6px 0; padding-inline-start: 20px; line-height: 1.9; font-size: 14px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #viewer { border: 0; padding: 0; border-radius: 14px; width: min(920px, 96vw); height: 90vh; overflow: hidden; }
  #viewer::backdrop { background: rgba(0,0,0,.6); }
  #viewer > div { display: flex; flex-direction: column; height: 100%; }
  #viewer .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; font-weight: 700; overflow-wrap: anywhere; }
  #frame { border: 0; width: 100%; flex: 1; background: #f1f1f4; }
  .tabs { display: flex; gap: 8px; margin: 14px 0; }
  .tab { font: inherit; font-weight: 800; border: 0; background: #e4e4e7; border-radius: 10px; padding: 9px 18px; cursor: pointer; }
  .tab.on { background: var(--indigo); color: #fff; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { font: inherit; font-size: 13px; font-weight: 700; border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 13px; cursor: pointer; }
  .chips button.on { background: #18181b; border-color: #18181b; color: #fff; }
  .order-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .order-head b { font-size: 17px; direction: ltr; unicode-bidi: embed; }
  .order-head select { font: inherit; font-weight: 700; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .total { font-weight: 900; font-size: 18px; }
  a.btn { text-decoration: none; display: inline-block; }
  @media (max-width: 640px) { .item { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <form class="card" id="login">
    <h1>لوحة CMG</h1>
    <label for="email">الإيميل</label><input id="email" type="email" required autocomplete="username">
    <label for="pass">الباسورد</label><input id="pass" type="password" required autocomplete="current-password">
    <button class="btn primary" id="go">دخول</button>
    <p class="err" id="loginErr" hidden></p>
  </form>
  <div id="app" hidden>
    <div class="top"><h1>لوحة CMG</h1><div><button class="btn" id="reload">تحديث</button> <button class="btn" id="out">خروج</button></div></div>
    <div class="tabs"><button class="tab on" data-tab="orders" id="tabOrdersBtn"></button><button class="tab" data-tab="store" id="tabStoreBtn"></button></div>
    <div id="tabOrders">
      <div class="chips" id="statusChips"></div>
      <div id="orders"></div>
    </div>
    <div id="tabStore" hidden>
    <p class="muted">قبل الموافقة اتأكد: مافيش لوجو براند أو اسم نادي، ولا شخصية كرتون أو صورة فنان أو لاعب، ومطابق لسياسة المحتوى.</p>
    <p class="err" id="err" hidden></p>
    <h2 id="pendingTitle"></h2>
    <div id="pending"></div>
    <h2 id="liveTitle"></h2>
    <div class="card" id="live"></div>
    </div>
  </div>
</main>
<dialog id="viewer"><div><div class="head"><span id="viewerTitle"></span><button class="btn" id="closeViewer">إغلاق</button></div><iframe id="frame" title="التصميم 3D"></iframe></div></dialog>
<script type="module">
import { login, listPending, listApproved, approve, reject, takeDown, listOrders, setOrderStatus, orderFileUrl } from './db.js?v=43';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
let token = null;
try { token = sessionStorage.getItem('cmg-admin'); } catch {}

const fmt = n => n.toLocaleString('ar-EG');
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const phoneOf = d => (Array.isArray(d.design_contacts) ? d.design_contacts[0] : d.design_contacts)?.phone || '—';
function showLogin() {
  token = null; try { sessionStorage.removeItem('cmg-admin'); } catch {}
  $('#app').hidden = true; $('#login').hidden = false;
}
// Anyone can submit, so nothing in a design is trusted: its pictures must be embedded, and all text is shown as text.
function problem(p) {
  if (!p || p.v !== 1 || !p.json || !Array.isArray(p.sides) || !p.product || !/^data:image\/jpeg;base64,/.test(p.preview || '')) return 'الملف ناقص أو مش من الموقع.';
  if ([...JSON.stringify(p.json).matchAll(/"src":"([^"]*)"/g)].some(m => !m[1].startsWith('data:image/'))) return 'التصميم فيه صور من موقع تاني، ومش هينفع ينزل.';
  return '';
}
async function run(fn) {
  $('#err').hidden = true;
  try { return await fn(); }
  catch (e) {
    console.error(e);
    if (e.status === 401 || e.status === 403) { showLogin(); $('#loginErr').textContent = 'انتهت الجلسة، ادخل تاني.'; $('#loginErr').hidden = false; return; }
    $('#err').textContent = 'حصلت مشكلة، جرّب تاني.'; $('#err').hidden = false;
  }
}
const ZONES = { front: 'الأمام', back: 'الخلف', sleeveR: 'الكم اليمين', sleeveL: 'الكم الشمال', hood: 'الكابتشو' };
// The 3D view is the studio itself in a frame; the design is handed to it only after it says it's ready.
let viewing = null;
function show3d(d, title) {
  viewing = d;
  $('#viewerTitle').textContent = title;
  $('#frame').src = './?review=1&nocount&v=42';
  $('#viewer').showModal();
}
addEventListener('message', e => {
  if (e.origin !== location.origin || e.source !== $('#frame').contentWindow || e.data?.type !== 'cmg-review-ready' || !viewing) return;
  e.source.postMessage({ type: 'cmg-review', pack: viewing.pack, title: viewing.title, designer: viewing.designer }, location.origin);
});
$('#closeViewer').onclick = () => $('#viewer').close();
$('#viewer').addEventListener('close', () => { viewing = null; $('#frame').removeAttribute('src'); });

function pendingCard(d) {
  const bad = problem(d.pack), title = el('input', { value: d.title, maxLength: 40 }), designer = el('input', { value: d.designer, maxLength: 40 });
  const view = el('button', { className: 'btn', textContent: 'شوفه 3D', disabled: !!bad });
  view.onclick = () => show3d(d, title.value);
  const ok = el('button', { className: 'btn ok', textContent: 'موافقة ونشر', disabled: !!bad }), no = el('button', { className: 'btn danger', textContent: 'رفض وحذف' });
  ok.onclick = () => run(async () => {
    if (!title.value.trim() || !designer.value.trim()) return alert('اكتب اسم التصميم والمصمم.');
    ok.disabled = true;
    await approve(token, d.id, title.value.trim(), designer.value.trim());
    await refresh();
  });
  no.onclick = () => run(async () => { if (confirm(`ترفض «${d.title}» وتحذفه نهائيًا؟`)) { await reject(token, d.id); await refresh(); } });
  const img = el('img', { alt: '' });
  if (/^data:image\/jpeg;base64,/.test(d.pack?.preview || '')) img.src = d.pack.preview;
  const info = el('p', { className: 'muted', textContent: `المنتج: ${d.pack?.product || '?'} • اللون: ${d.pack?.color || '?'} • الطباعة: ${(d.pack?.sides || []).map(z => ZONES[z] || z).join(' + ')} • رقم التحويل: ${phoneOf(d)}` });
  const body = el('div', {}, el('label', { textContent: 'اسم التصميم' }), title, el('label', { textContent: 'اسم المصمم' }), designer, info);
  if (bad) body.append(el('p', { className: 'err', textContent: bad }));
  body.append(el('div', { className: 'actions' }, view, ok, no));
  return el('div', { className: 'card item' }, img, body);
}
// ---------- Orders ----------
const STATUS = { new: 'جديد', making: 'بيتنفذ', shipped: 'اتشحن', delivered: 'اتسلم', cancelled: 'اتلغى' };
let orders = [], filter = 'all';
$$('.tab').forEach(b => b.onclick = () => {
  $$('.tab').forEach(x => x.classList.toggle('on', x === b));
  $('#tabOrders').hidden = b.dataset.tab !== 'orders'; $('#tabStore').hidden = b.dataset.tab !== 'store';
});
const egMoney = n => `${Number(n).toLocaleString('ar-EG')} ج.م`;
const waNumber = p => { const d = String(p).replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D/g, ''); return d.startsWith('0') ? '2' + d : d; };
function orderLines(o) {
  const d = o.details || {}, qty = Object.entries(d.qty || {}).map(([s, n]) => `${s}×${n}`).join('  ');
  return [
    o.store_code && `من الاستور: ${o.store_code}${d.store?.title ? ` – ${d.store.title}` : ''} – المصمم: ${o.designer} – العمولة: ${egMoney(o.commission)}`,
    `${d.product || o.product}${d.color ? ` • ${d.color}` : ''}`, d.print && `الطباعة: ${d.print}`, qty && `المقاسات: ${qty}`, d.custom, d.fit && `المقاس: ${d.fit}`, d.strings && `الرباط: ${d.strings}`, d.rib && `الأساور والأستيك: ${d.rib}`, d.stripes && `خطوط اسبورت: ${d.stripes}`,
    d.set && `طقم: ${d.set.item}`, d.partner && `القطعة التانية: ${d.partner.label} – ${d.partner.color} – ${d.partner.print}`, d.ready && 'تصميم جاهز من العميل',
  ].filter(Boolean);
}
function orderCard(o) {
  const sel = el('select'); for (const [k, v] of Object.entries(STATUS)) sel.append(new Option(v, k, k === o.status, k === o.status));
  sel.onchange = () => run(async () => { await setOrderStatus(token, o.id, sel.value); o.status = sel.value; renderOrders(); });
  const when = new Date(o.created_at).toLocaleString('ar-EG', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'Africa/Cairo' });
  const body = [el('div', { className: 'order-head' }, el('span', {}, el('b', { textContent: o.code }), el('span', { className: 'muted', textContent: `  ${when}` })), sel)];
  body.push(el('p', { className: 'muted', textContent: `${o.name} • ${o.phone} • ${o.city} • ${o.address}` }));
  for (const line of orderLines(o)) body.push(el('p', { className: 'muted', textContent: line }));
  if (o.notes) body.push(el('p', { className: 'muted', textContent: `ملاحظات: ${o.notes}` }));
  body.push(el('p', { className: 'total', textContent: `${egMoney(o.total)} • ${Number(o.pcs).toLocaleString('ar-EG')} قطعة` }));
  if (o.client_total != null && Number(o.client_total) !== Number(o.total)) body.push(el('p', { className: 'err', textContent: `السعر اللي ظهر للعميل كان ${egMoney(o.client_total)}، راجعه قبل التنفيذ.` }));
  const actions = el('div', { className: 'actions' });
  const openFile = (path, wrap) => run(async () => { const w = window.open('', '_blank'); const url = await orderFileUrl(token, path); w.location = wrap ? `shop.html?pdf=${encodeURIComponent(url)}` : url; });
  if (o.files?.length) {
    actions.append(el('button', { className: 'btn ok', textContent: 'الفاتورة ونسخة المطبعة', onclick: () => openFile(o.files[0], true) }));
    o.files.forEach((f, i) => actions.append(el('button', { className: 'btn', textContent: i ? `ملف ${i + 1}` : 'ملف الطلب PDF', onclick: () => openFile(f, false) })));
  } else body.push(el('p', { className: 'err', textContent: 'الملف ماتحملش مع الطلب، اطلب التصميم من العميل.' }));
  actions.append(el('a', { className: 'btn', textContent: 'كلم العميل واتساب', href: `https://wa.me/${waNumber(o.phone)}?text=${encodeURIComponent(`أهلًا ${o.name}، بخصوص طلبك رقم ${o.code} من CMG`)}`, target: '_blank', rel: 'noopener' }));
  body.push(actions);
  return el('div', { className: 'card' }, ...body);
}
function renderOrders() {
  const count = k => orders.filter(o => o.status === k).length;
  $('#tabOrdersBtn').textContent = `الطلبات (${fmt(count('new'))} جديد)`;
  $('#statusChips').replaceChildren(...[['all', 'الكل'], ...Object.entries(STATUS)].map(([k, v]) => el('button', { className: k === filter ? 'on' : '', textContent: `${v} (${fmt(k === 'all' ? orders.length : count(k))})`, onclick: () => { filter = k; renderOrders(); } })));
  const list = orders.filter(o => filter === 'all' || o.status === filter);
  $('#orders').replaceChildren(...(list.length ? list.map(orderCard) : [el('div', { className: 'card muted', textContent: 'مفيش طلبات هنا.' })]));
}

let shown = '';
// Background checks redraw only when the list changed, and never while a name is being edited.
async function refresh(background = false) {
  const [pending, live, allOrders] = await Promise.all([listPending(token), listApproved(token), listOrders(token)]);
  const ids = [...pending, ...live].map(d => d.id).join() + '|' + allOrders.map(o => o.id + o.status).join();
  if (background && (ids === shown || document.activeElement?.closest?.('#pending, #orders'))) return;
  shown = ids;
  orders = allOrders;
  renderOrders();
  $('#tabStoreBtn').textContent = `الاستور (${fmt(pending.length)} للمراجعة)`;
  $('#pendingTitle').textContent = `مستني المراجعة (${fmt(pending.length)})`;
  $('#pending').replaceChildren(...(pending.length ? pending.map(pendingCard) : [el('div', { className: 'card muted', textContent: 'مفيش تصاميم جديدة.' })]));
  $('#liveTitle').textContent = `منشور في الاستور (${fmt(live.length)})`;
  $('#live').replaceChildren(...(live.length ? live.map(d => {
    const off = el('button', { className: 'btn danger', textContent: 'شيله' });
    off.onclick = () => run(async () => { if (confirm(`تشيل «${d.title}» من الاستور؟`)) { await takeDown(token, d.id); await refresh(); } });
    return el('div', { className: 'row' }, el('span', { textContent: `${d.code} – ${d.title} – ${d.designer} – رقم التحويل: ${phoneOf(d)}` }), off);
  }) : [el('span', { className: 'muted', textContent: 'لسه مفيش تصاميم منشورة.' })]));
}
async function enter() { $('#login').hidden = true; $('#app').hidden = false; await run(refresh); }
$('#login').onsubmit = async e => {
  e.preventDefault();
  $('#loginErr').hidden = true; $('#go').disabled = true;
  try {
    token = await login($('#email').value.trim(), $('#pass').value);
    $('#pass').value = '';
    try { sessionStorage.setItem('cmg-admin', token); } catch {}
    await enter();
  } catch (err) {
    $('#loginErr').textContent = err.status === 400 ? 'الإيميل أو الباسورد غلط.' : 'ماقدرناش ندخل، جرّب تاني.';
    $('#loginErr').hidden = false;
  } finally { $('#go').disabled = false; }
};
$('#out').onclick = showLogin;
$('#reload').onclick = () => run(() => refresh());
// New designs show up by themselves while the page is open.
const poll = () => { if (token && !$('#app').hidden && !document.hidden) run(() => refresh(true)); };
setInterval(poll, 15000);
document.addEventListener('visibilitychange', poll);
addEventListener('focus', poll);
if (token) enter();
</script>
</body>
</html>
